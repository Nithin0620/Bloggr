services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bloggr-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
    networks:
      - bloggr-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - REACT_APP_MODE=production
    container_name: bloggr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bloggr-net

networks:
  bloggr-net:
    driver: bridge
