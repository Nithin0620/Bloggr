services:
  backend:
    image: ghcr.io/nithin0620/bloggr-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bloggr-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    depends_on:
      - redis
      - qdrant
    networks:
      - bloggr-net

  frontend:
    image: ghcr.io/nithin0620/bloggr-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - REACT_APP_MODE=production
    container_name: bloggr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bloggr-net

  redis:
    image: redis:7-alpine
    container_name: bloggr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bloggr-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bloggr-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - bloggr-net

networks:
  bloggr-net:
    driver: bridge

volumes:
  qdrant_storage:

